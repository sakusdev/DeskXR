plugins {
    id "com.android.application"
}

android {
    namespace "org.sakus.deskxr"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "org.sakus.deskxr"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "0.1.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.63"
}
